[project]
name = "mafia-game"
version = "0.1.0"
description = "Mafia game API + Telegram bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.135.3",
    "pydantic-settings>=2.13.1",
    "sqlalchemy[asyncio]>=2.0.49",
]

[project.optional-dependencies]
bot = [
    "aiogram>=3.27.0",
    "httpx[http2]>=0.28.1",
]
dev = [
    "black>=26.3.1",
    "isort>=6.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
]

[tool.black]
line-length = 80
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 80

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
